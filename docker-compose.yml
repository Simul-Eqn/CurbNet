services:
  curbnet:
    image: curbnet:latest
    
    build:
      context: .
      dockerfile: Dockerfile.notchina 
    
    volumes:
      - ../:/app/files
    
    gpus: all
    shm_size: '24gb'
    ports:
      - "127.0.0.1:5000:5000"

    command: tail -f /dev/null

